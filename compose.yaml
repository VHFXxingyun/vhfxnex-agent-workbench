services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      GOALFLOW_BACKUP_DIR: /backups
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - goalflow_data:/app/data
      - type: bind
        source: ./.env.local
        target: /app/.env.local
        read_only: true
      - type: bind
        source: ./backups
        target: /backups
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    stop_grace_period: 30s

volumes:
  goalflow_data:
    name: vhfxnex_goalflow_data
